[triage_agent]
# deepseek: claude CLI + OpenCode Go 订阅 Anthropic 端点（DEEPSEEK_API_KEY=OpenCode Go key）
provider = "deepseek"
runner_labels = ["self-hosted", "bugpatrol-fived-triage"]
model = ""
effort = ""

# Cross-repo reference: fived 前端调用 weaver 后端，分诊时只读引用 weaver。
# 分支默认取主库解析出的目标分支同名分支，weaver 上不存在则静默退回 main。
# 运行侧由 triage workflow 自愈 clone-or-fetch 到 ~/clover/weaver 并经
# --reference-repo 传入（config 声明与 workflow 必须同时在线，否则 fail-loud）。
[[triage.reference_repos]]
repo = "TheCloverLab/weaver"
path = "~/clover/weaver"
purpose = "Go backend for the fived frontend (proto routes, comment/chat permissions, quest errors)"

# Auto-fix runner. The fix agent edits code in a `bugpatrol/fix-issue-N`
# worktree, then this gate runs fived's OWN pre-PR check before opening a PR
# (never merges) — same philosophy as revise/[fix.verify]: we only read the
# project's own gate, not reimplement it. `scripts/preflight.sh` (no arg = full)
# is fived's canonical pre-push gate: type check + lint + unit + build + surface
# tests — the same bar a human must clear before opening a fived PR, so the bot
# holds itself to the same rule.
# A fresh worktree has no node_modules and preflight requires it, so `npm ci`
# runs first as one-time setup — before the agent turn, so the agent can
# self-verify (typecheck/test) with deps present and iterate to green — and it
# is NOT re-run on every verify (it persists across the baseline-attribution
# reset). `[fix.verify]` is then just the pass/fail gate the agent must clear.
# `serve` is required by preflight's surface-tests step; the canonical home for
# it is fived's scripts/ci-runner-setup.sh (host provisioning), but this guarded
# line self-heals any runner that predates that (no-op once serve is present, so
# no network unless it's actually missing) — a fresh runner without serve would
# otherwise fail the full preflight gate and be misread as baseline-red.
[fix.setup]
install = "npm ci --no-audit --no-fund"
serve = "command -v serve > /dev/null 2>&1 || npm install -g serve"

[fix.verify]
preflight = "./scripts/preflight.sh"

[fix.gate]
max_diff_lines = 800
max_conflict_files = 5
# `Case 错误` = a test-coverage gap: the product code is correct but a test is
# missing. Adding the missing test is exactly what auto-fix does well (the fix
# prompt already requires tests and self-verifies to green), so it is allowed
# alongside `代码 Bug` rather than skipped for a human.
allowed_verdicts = ["代码 Bug", "Case 错误"]

# Install/preview links fived's build workflows post as PR comments once a build
# actually deploys an artifact. The build-ready notification harvests these from
# the fix PR's comments and surfaces the real links; if a build deploys nothing
# (e.g. a test-only fix), no link comment exists and the notification stays
# silent about install/preview rather than pointing at absent PR comments.
# Formats (see fived .github/workflows): build-web `🔗 **Preview:** <url>`,
# build-ios `📱 **iOS install:** <url>`, build-android `- Install APK: <url>`.
[[fix.build_links]]
label = "预览"
pattern = "\\*\\*Preview:\\*\\* (https://\\S+)"

[[fix.build_links]]
label = "iOS 安装"
pattern = "\\*\\*iOS install:\\*\\* (https://\\S+)"

[[fix.build_links]]
label = "Android 安装"
pattern = "Install APK: (https://\\S+)"

[close_audit]
# GitHub can't reject a close, so "closed as completed" without a linked fix
# commit/merged PR is enforced after the fact: bugpatrol reopens it. Close as
# not planned / duplicate (or add a `Fixes #N` reference) to close for good.
reopen_completed_without_evidence = true

[prd]
root_wiki_node = "LOCAL_PRD_DOCS"
cache_path = "openspec"
include_globs = ["specs/**/spec.md", "changes/**/prd-snapshot.md"]

[intake]
language = "zh-CN"
# 只处理 2026-07-06 00:00 (+08:00) 之后的消息；老话题的孤儿回复不建 issue
since = "2026-07-06T00:00:00+08:00"
skip_orphan_replies = true

[assets]
github_repo = "TheCloverLab/fived-assets"
checkout_path = "~/clover/fived-assets"
base_path = ".github/issue-assets"
branch = "main"

[media]
description_command = [
  "{python}",
  "-m",
  "bugpatrol.media_vision",
  "{path}",
  "客观描述这个媒体文件中实际可见的内容：所在界面、关键 UI 元素与文字、错误提示或异常状态；视频按时间顺序列出关键画面变化。若画面出现悬浮的调试信息浮层（dev overlay，如 FPS、网络、内存、设备信息等实时数据），这是开发/测试环境的正常组件，不是 bug，其数据可作分析参考，但不要把它当作异常状态。只陈述看到的事实，不要推测原因、不要做 bug 分析、不要给修复建议。150 字以内。",
]
description_timeout_seconds = 300
resize_max_image_width = 1600
resize_max_image_height = 1600
resize_image_quality = 85
convert_images_to_jpeg = true

