# Branch-scoped topic groups: bugs reported here are analyzed against the
# branch named in the group instead of main.
#
# CI creates one group per branch named "<prefix> · <branch>" (fived ·
# feature-x), and names the main group the same way -- "fived · main" -- so
# there is no special case to remember. The watcher adopts a branch group by
# name, so a new branch needs no config edit and no restart (fived
# `.github/workflows/bugpatrol-feature-topic.yml`). The prefix is what keeps
# projects apart: one Lark app serves every project, so the chat list is global
# and matching on a bare branch name claimed a group whose branch also existed
# in another repo, turning one topic into an issue in both.
#
# Adding a [[lark.branch_chats]] entry still pins one group into the scan set
# ahead of discovery -- the escape hatch for a group that cannot be renamed.

# GitHub login -> Lark open_id，用于分诊/追问消息里真正 @ 到人
[lark.user_open_ids]
garlanddiego = "ou_5935e6148d74f4d907c821d151e1bd09"
wind2star = "ou_d9b2bf738170fabc6f01c03906918a25"
