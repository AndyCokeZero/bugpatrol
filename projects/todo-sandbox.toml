github_repo = "TheCloverLab/bugpatrol-todo-sandbox"
# 以 sobit-bot[bot] GitHub App 身份执行所有 gh 操作
github_cli = "/Users/dinghaozeng/clover/fived/scripts/gh-as-bot.sh"

[lark]
chat_id = "oc_d371f022f168b567a141ced142691894"
app_id = "cli_aac97d050d385ee9"
app_secret_env = "BUGPATROL_TODO_LARK_APP_SECRET"
bot_open_id = "ou_cef931fa2df05ca6f8ae80cb2f3e6094"
platform = "lark"
# Topic groups are named "<prefix> · <branch>". The default is the repo's own
# name, but this project's groups are labelled "BugPatrol Sandbox", so the
# prefix has to say so.
chat_prefix = "BugPatrol Sandbox"

# Branch-scoped topic group: bugs reported here are analyzed against feature-demo.
[[lark.branch_chats]]
chat_id = "oc_01a7b00d7c8645fa8c327a02d30b68cc"
branch = "feature-demo"

[triage_agent]
# deepseek: claude CLI + DeepSeek Anthropic 端点（需 DEEPSEEK_API_KEY）
provider = "deepseek"
runner_labels = ["self-hosted", "bugpatrol-sandbox-triage"]
model = ""
effort = ""

[prd]
root_wiki_node = "LOCAL_PRD_DOCS"
cache_path = "docs/prd"

[intake]
language = "zh-CN"

[assets]
github_repo = "TheCloverLab/bugpatrol-todo-sandbox-assets"
checkout_path = "~/clover/bugpatrol-todo-sandbox-assets"
base_path = ".github/issue-assets"
branch = "main"
remote_url = "https://github.com/TheCloverLab/bugpatrol-todo-sandbox-assets.git"

[media]
description_command = [
  "{python}",
  "-m",
  "bugpatrol.media_vision",
  "{path}",
  "客观描述这个媒体文件中实际可见的内容：所在界面、关键 UI 元素与文字、错误提示或异常状态；视频按时间顺序列出关键画面变化。只陈述看到的事实，不要推测原因、不要做 bug 分析、不要给修复建议。150 字以内。",
]
description_timeout_seconds = 300

[fix.setup]
# One-time worktree prep, run before the agent turn (so it can self-verify with
# deps present) and once per run — the fresh worktree has no node_modules.
install = "npm install --no-audit --no-fund"

[fix.verify]
# Project-owned verification commands (BugPatrol only runs each and reads the
# exit code). The agent self-runs these to iterate to green, and every command
# must pass the harness gate before a fix PR is opened.
typecheck = "npm run typecheck"
test = "npm test"

[fix.gate]
max_diff_lines = 800
# When an open fix PR conflicts with its target branch, revise merges the target
# in and auto-resolves — but only up to this many conflicted files; beyond it the
# conflict is escalated to a human instead of auto-resolved.
max_conflict_files = 5

[issue_field_names]
Priority = "Priority"
"Triage status" = "Triage status"
Source = "Source"
"Intake version" = "Intake version"
"Triage verdict" = "Triage verdict"
Platform = "Platform"
Reproducibility = "Reproducibility"
"Other platforms" = "Other platforms"
Capability = "Capability"
Evidence = "Evidence"
"PRD status" = "PRD status"
"Triage confidence" = "Triage confidence"
"Owner reason" = "Owner reason"
Owner = "Owner"
Branch = "Branch"
